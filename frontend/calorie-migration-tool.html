<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡路里计算迁移工具 - ZenFit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .info-box ul {
            margin-left: 20px;
            line-height: 1.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .comparison-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #667eea;
        }

        .comparison-table tr:hover {
            background: #f8f9fa;
        }

        .positive {
            color: #10b981;
            font-weight: 600;
        }

        .negative {
            color: #ef4444;
            font-weight: 600;
        }

        .result-box {
            background: #10b981;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }

        .result-box.error {
            background: #ef4444;
        }

        .result-box.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔥 卡路里计算迁移工具</h1>
        <p class="subtitle">将所有历史训练记录从旧的计算方法迁移到新的科学计算方法</p>

        <div class="info-box">
            <h3>📊 新计算方法的优势</h3>
            <ul>
                <li>✅ 基于实际训练负荷（重量 × 次数 × 组数）</li>
                <li>✅ 考虑用户体重和体脂率</li>
                <li>✅ 区分复合动作和孤立动作</li>
                <li>✅ 包含EPOC效应（运动后持续燃烧）</li>
                <li>✅ 更科学、更准确的卡路里估算</li>
            </ul>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalSessions">-</div>
                <div class="stat-label">训练记录</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalReports">-</div>
                <div class="stat-label">周报</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="userWeight">-</div>
                <div class="stat-label">当前体重 (kg)</div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="performMigration()">
                🚀 开始迁移
            </button>
            <button class="btn-secondary" onclick="showComparison()">
                📊 查看对比
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在处理中...</p>
        </div>

        <div class="result-box" id="result"></div>

        <div id="comparisonContainer"></div>
    </div>

    <script>
        // 加载统计信息
        function loadStats() {
            // 🆕 支持多种可能的键名
            const sessions = JSON.parse(
                localStorage.getItem('workout-sessions') ||
                localStorage.getItem('zenfit_history') ||
                localStorage.getItem('workouts') ||
                '[]'
            );
            const reports = JSON.parse(
                localStorage.getItem('weekly-reports') ||
                localStorage.getItem('zenfit_reports') ||
                '[]'
            );
            const profile = JSON.parse(
                localStorage.getItem('user-profile') ||
                localStorage.getItem('zenfit_user_profile') ||
                '{"weight": 75}'
            );

            document.getElementById('totalSessions').textContent = sessions.length;
            document.getElementById('totalReports').textContent = reports.length;
            document.getElementById('userWeight').textContent = profile.weight || 75;
        }

        // 执行迁移
        async function performMigration() {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            loading.classList.add('show');
            result.classList.remove('show');

            try {
                // 🆕 加载数据 - 支持多种键名
                const sessionsJson = localStorage.getItem('workout-sessions') ||
                    localStorage.getItem('zenfit_history') ||
                    localStorage.getItem('workouts');
                const reportsJson = localStorage.getItem('weekly-reports') ||
                    localStorage.getItem('zenfit_reports');
                const profileJson = localStorage.getItem('user-profile') ||
                    localStorage.getItem('zenfit_user_profile');

                if (!sessionsJson) {
                    throw new Error('没有找到训练记录。\n\n可能的原因：\n1. 数据在不同的端口/域名\n2. 数据键名不匹配\n3. 还未同步数据\n\n请先在诊断工具中查看实际的存储键名');
                }

                const sessions = JSON.parse(sessionsJson);
                const reports = reportsJson ? JSON.parse(reportsJson) : [];
                const profile = profileJson ? JSON.parse(profileJson) : { weight: 75, bodyFatPercentage: 20 };

                // 重新计算所有周报的卡路里
                const updatedReports = reports.map(report => {
                    let totalCalories = 0;

                    report.sessions.forEach(session => {
                        const calories = calculateWorkoutCalories(session, profile);
                        totalCalories += calories;
                    });

                    return {
                        ...report,
                        stats: {
                            ...report.stats,
                            totalCalories: Math.round(totalCalories)
                        }
                    };
                });

                // 保存更新后的数据
                localStorage.setItem('weekly-reports', JSON.stringify(updatedReports));

                // 显示结果
                loading.classList.remove('show');
                result.className = 'result-box show';
                result.innerHTML = `
                    <h3>✅ 迁移成功！</h3>
                    <p>已更新 ${sessions.length} 条训练记录和 ${updatedReports.length} 份周报</p>
                    <p style="margin-top: 10px; opacity: 0.9;">请刷新页面查看更新后的数据</p>
                `;

                // 重新加载统计
                loadStats();

            } catch (error) {
                loading.classList.remove('show');
                result.className = 'result-box error show';
                result.innerHTML = `
                    <h3>❌ 迁移失败</h3>
                    <p>${error.message}</p>
                `;
            }
        }

        // 显示对比
        function showComparison() {
            // 🆕 支持多种键名
            const sessions = JSON.parse(
                localStorage.getItem('workout-sessions') ||
                localStorage.getItem('zenfit_history') ||
                localStorage.getItem('workouts') ||
                '[]'
            );
            const profile = JSON.parse(
                localStorage.getItem('user-profile') ||
                localStorage.getItem('zenfit_user_profile') ||
                '{"weight": 75, "bodyFatPercentage": 20}'
            );

            if (sessions.length === 0) {
                alert('没有训练记录');
                return;
            }

            // 只显示前10条
            const sampled = sessions.slice(0, 10);

            let html = '<h3 style="margin-top: 30px; color: #667eea;">📊 卡路里对比（前10条）</h3>';
            html += '<table class="comparison-table">';
            html += '<thead><tr><th>日期</th><th>时长</th><th>负荷</th><th>旧值</th><th>新值</th><th>变化</th></tr></thead>';
            html += '<tbody>';

            sampled.forEach(session => {
                const date = new Date(session.date).toLocaleDateString();
                const duration = session.durationMinutes || 0;
                const volume = session.volumeLoad;

                const oldCalories = Math.round((duration / 60) * 5 * (profile.weight || 75));
                const newCalories = calculateWorkoutCalories(session, profile);
                const diff = newCalories - oldCalories;
                const diffClass = diff > 0 ? 'positive' : 'negative';
                const diffSign = diff > 0 ? '+' : '';

                html += `<tr>
                    <td>${date}</td>
                    <td>${duration}分钟</td>
                    <td>${volume}kg</td>
                    <td>${oldCalories} kcal</td>
                    <td>${newCalories} kcal</td>
                    <td class="${diffClass}">${diffSign}${diff} kcal</td>
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('comparisonContainer').innerHTML = html;
        }

        // 科学的卡路里计算（简化版）
        function calculateWorkoutCalories(session, userProfile) {
            const userWeight = userProfile.weight || 75;
            const bodyFat = userProfile.bodyFatPercentage || 20;
            const leanMass = userWeight * (1 - bodyFat / 100);

            let totalCalories = 0;

            // 1. 基于训练负荷
            session.exercises.forEach(exercise => {
                const completedSets = exercise.sets.filter(s => s.completed);
                if (completedSets.length === 0) return;

                const exerciseVolume = completedSets.reduce((sum, set) => {
                    return sum + (set.weight * set.reps);
                }, 0);

                const mechanicMultiplier = exercise.mechanic === 'Compound' ? 1.3 : 1.0;
                const leanMassMultiplier = 0.05 + (leanMass / 1000);
                const exerciseCalories = (exerciseVolume / 1000) * 6.5 * mechanicMultiplier * leanMassMultiplier;

                totalCalories += exerciseCalories;
            });

            // 2. 基于组数
            const totalSets = session.exercises.reduce((sum, ex) => {
                return sum + ex.sets.filter(s => s.completed).length;
            }, 0);
            const setCalories = totalSets * (3 + (userWeight / 100));
            totalCalories += setCalories;

            // 3. 基于时间的BMR
            const durationHours = (session.durationMinutes || 0) / 60;
            const dailyBMR = 370 + (21.6 * leanMass);
            const hourlyBMR = dailyBMR / 24;
            const bmrDuringWorkout = hourlyBMR * 1.5;
            const timeBasedCalories = bmrDuringWorkout * durationHours;
            totalCalories += timeBasedCalories;

            // 4. EPOC效应
            const epocBonus = totalCalories * 0.15;
            totalCalories += epocBonus;

            return Math.round(totalCalories);
        }

        // 页面加载时初始化
        loadStats();
    </script>
</body>

</html>
