<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routine 诊断工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }

        h1 {
            color: #10b981;
            border-bottom: 2px solid #10b981;
            padding-bottom: 10px;
        }

        h2 {
            color: #3b82f6;
            margin-top: 30px;
        }

        .section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .routine-card {
            background: #334155;
            border-left: 4px solid #10b981;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .routine-card.missing {
            border-left-color: #ef4444;
        }

        .routine-name {
            font-size: 18px;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 8px;
        }

        .routine-card.missing .routine-name {
            color: #ef4444;
        }

        .routine-info {
            font-size: 14px;
            color: #94a3b8;
            margin: 4px 0;
        }

        .routine-exercises {
            margin-top: 10px;
            padding-left: 20px;
        }

        .exercise-item {
            color: #cbd5e1;
            font-size: 13px;
            margin: 3px 0;
        }

        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        button:hover {
            background: #059669;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #10b981;
        }

        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }

        pre {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }

        .warning {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            color: #92400e;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }

        .success {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            color: #065f46;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>🔍 Routine 诊断工具</h1>

    <div class="section">
        <h2>📊 统计信息</h2>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">总 Routines</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="localCount">-</div>
                <div class="stat-label">本地 Routines</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="backendCount">-</div>
                <div class="stat-label">后端 Routines</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>📋 所有 Routines</h2>
        <div id="routinesList"></div>
    </div>

    <div class="section">
        <h2>🔧 操作</h2>
        <button onclick="refreshData()">🔄 刷新数据</button>
        <button onclick="exportRoutines()">💾 导出 Routines</button>
        <button onclick="showRawData()">📄 查看原始数据</button>
        <button class="danger" onclick="clearLocalStorage()">🗑️ 清空本地数据</button>
    </div>

    <div class="section" id="rawDataSection" style="display: none;">
        <h2>📄 原始数据</h2>
        <pre id="rawData"></pre>
    </div>

    <script>
        let routinesData = [];

        function loadRoutines() {
            try {
                const stored = localStorage.getItem('zenfit_routines');
                if (stored) {
                    routinesData = JSON.parse(stored);
                    console.log('✅ Loaded routines:', routinesData);
                } else {
                    routinesData = [];
                    console.log('⚠️ No routines found in localStorage');
                }
            } catch (error) {
                console.error('❌ Failed to load routines:', error);
                routinesData = [];
            }
            displayRoutines();
        }

        function displayRoutines() {
            const totalCount = routinesData.length;
            const localCount = routinesData.filter(r => !isUUID(r.id)).length;
            const backendCount = routinesData.filter(r => isUUID(r.id)).length;

            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('localCount').textContent = localCount;
            document.getElementById('backendCount').textContent = backendCount;

            const listContainer = document.getElementById('routinesList');

            if (routinesData.length === 0) {
                listContainer.innerHTML = '<div class="warning">⚠️ 没有找到任何 Routine 数据</div>';
                return;
            }

            listContainer.innerHTML = routinesData.map((routine, index) => {
                const isBackendId = isUUID(routine.id);
                const createdDate = new Date(routine.createdAt).toLocaleString('zh-CN');

                return `
                    <div class="routine-card">
                        <div class="routine-name">${routine.name}</div>
                        <div class="routine-info">
                            <strong>ID:</strong> ${routine.id} 
                            <span style="color: ${isBackendId ? '#10b981' : '#f59e0b'}">
                                (${isBackendId ? '后端' : '本地'})
                            </span>
                        </div>
                        <div class="routine-info"><strong>创建时间:</strong> ${createdDate}</div>
                        <div class="routine-info"><strong>动作数量:</strong> ${routine.exercises?.length || 0}</div>
                        ${routine.exercises && routine.exercises.length > 0 ? `
                            <div class="routine-exercises">
                                <strong>动作列表:</strong>
                                ${routine.exercises.map(ex => `
                                    <div class="exercise-item">• ${ex.nameZh || ex.name}</div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function isUUID(str) {
            const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            return uuidRegex.test(str);
        }

        function refreshData() {
            loadRoutines();
            alert('✅ 数据已刷新');
        }

        function exportRoutines() {
            const dataStr = JSON.stringify(routinesData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `zenfit_routines_${Date.now()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function showRawData() {
            const section = document.getElementById('rawDataSection');
            const pre = document.getElementById('rawData');

            if (section.style.display === 'none') {
                section.style.display = 'block';
                pre.textContent = JSON.stringify(routinesData, null, 2);
            } else {
                section.style.display = 'none';
            }
        }

        function clearLocalStorage() {
            if (confirm('⚠️ 确定要清空本地 Routine 数据吗？此操作无法撤销！')) {
                localStorage.removeItem('zenfit_routines');
                routinesData = [];
                displayRoutines();
                alert('✅ 本地数据已清空');
            }
        }

        // 页面加载时自动加载数据
        window.addEventListener('DOMContentLoaded', loadRoutines);
    </script>
</body>

</html>
