<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage 诊断工具 - ZenFit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .key-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .key-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .key-info {
            font-size: 14px;
            color: #666;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .key-info span {
            display: inline-block;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #10b981;
            color: white;
        }

        .badge-warning {
            background: #f59e0b;
            color: white;
        }

        .badge-error {
            background: #ef4444;
            color: white;
        }

        .badge-info {
            background: #3b82f6;
            color: white;
        }

        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.5;
            max-height: 300px;
            overflow-y: auto;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e5e7eb;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-warning {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            color: #92400e;
        }

        .alert-info {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            color: #1e40af;
        }

        .expandable {
            cursor: pointer;
            user-select: none;
        }

        .expandable:hover {
            background: #f3f4f6;
        }

        .content {
            display: none;
            margin-top: 10px;
        }

        .content.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 LocalStorage 诊断工具</h1>
        <p class="subtitle">检查所有存储的数据和可能的问题</p>

        <div class="button-group">
            <button class="btn-primary" onclick="runDiagnostic()">🔄 刷新诊断</button>
            <button class="btn-secondary" onclick="exportData()">📥 导出所有数据</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ 清空所有数据</button>
        </div>

        <div id="summary" class="section">
            <h2>📊 存储概览</h2>
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <div id="keys" class="section">
            <h2>🔑 所有存储键</h2>
            <div id="keysList"></div>
        </div>

        <div id="details" class="section">
            <h2>📝 详细数据</h2>
            <div id="detailsList"></div>
        </div>
    </div>

    <script>
        function runDiagnostic() {
            console.log('🔍 开始诊断...');

            // 获取所有localStorage键
            const keys = Object.keys(localStorage);
            console.log(`找到 ${keys.length} 个存储键:`, keys);

            // 统计信息
            const stats = {
                totalKeys: keys.length,
                totalSize: 0,
                workoutSessions: 0,
                weeklyReports: 0,
                routines: 0,
                hasProfile: false,
                hasAuthToken: false
            };

            // 分析每个键
            const keyDetails = [];

            keys.forEach(key => {
                const value = localStorage.getItem(key);
                const size = new Blob([value]).size;
                stats.totalSize += size;

                let type = 'unknown';
                let count = 0;
                let preview = '';

                try {
                    if (key === 'workout-sessions') {
                        const data = JSON.parse(value);
                        type = 'workout-sessions';
                        count = Array.isArray(data) ? data.length : 0;
                        stats.workoutSessions = count;
                        preview = `${count} 条训练记录`;
                    } else if (key === 'weekly-reports') {
                        const data = JSON.parse(value);
                        type = 'weekly-reports';
                        count = Array.isArray(data) ? data.length : 0;
                        stats.weeklyReports = count;
                        preview = `${count} 份周报`;
                    } else if (key === 'routines') {
                        const data = JSON.parse(value);
                        type = 'routines';
                        count = Array.isArray(data) ? data.length : 0;
                        stats.routines = count;
                        preview = `${count} 个训练计划`;
                    } else if (key === 'user-profile') {
                        type = 'user-profile';
                        stats.hasProfile = true;
                        const data = JSON.parse(value);
                        preview = `体重: ${data.weight || 'N/A'}kg`;
                    } else if (key.includes('token') || key.includes('auth')) {
                        type = 'auth';
                        stats.hasAuthToken = true;
                        preview = '认证令牌';
                    } else {
                        type = 'other';
                        preview = value.substring(0, 50) + (value.length > 50 ? '...' : '');
                    }
                } catch (e) {
                    type = 'invalid-json';
                    preview = '无效的JSON数据';
                }

                keyDetails.push({
                    key,
                    type,
                    size,
                    count,
                    preview,
                    value
                });
            });

            // 显示统计
            displayStats(stats);

            // 显示键列表
            displayKeys(keyDetails);

            // 显示详细数据
            displayDetails(keyDetails);

            // 检查问题
            checkIssues(stats, keyDetails);
        }

        function displayStats(stats) {
            const html = `
                <div class="stat-card">
                    <div class="stat-value">${stats.totalKeys}</div>
                    <div class="stat-label">总键数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${formatBytes(stats.totalSize)}</div>
                    <div class="stat-label">总大小</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.workoutSessions}</div>
                    <div class="stat-label">训练记录</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.weeklyReports}</div>
                    <div class="stat-label">周报</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.routines}</div>
                    <div class="stat-label">训练计划</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.hasProfile ? '✓' : '✗'}</div>
                    <div class="stat-label">用户资料</div>
                </div>
            `;
            document.getElementById('statsGrid').innerHTML = html;
        }

        function displayKeys(keyDetails) {
            let html = '';
            keyDetails.forEach(item => {
                const badgeClass = item.type === 'workout-sessions' || item.type === 'weekly-reports' || item.type === 'routines'
                    ? 'badge-success'
                    : item.type === 'invalid-json'
                        ? 'badge-error'
                        : 'badge-info';

                html += `
                    <div class="key-item">
                        <div class="key-name">
                            ${item.key}
                            <span class="badge ${badgeClass}">${item.type}</span>
                        </div>
                        <div class="key-info">
                            <span>📦 大小: ${formatBytes(item.size)}</span>
                            ${item.count > 0 ? `<span>📊 数量: ${item.count}</span>` : ''}
                            <span>👁️ ${item.preview}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('keysList').innerHTML = html || '<p>没有找到任何存储键</p>';
        }

        function displayDetails(keyDetails) {
            let html = '';
            keyDetails.forEach(item => {
                const id = `detail-${item.key.replace(/[^a-zA-Z0-9]/g, '-')}`;
                html += `
                    <div class="key-item expandable" onclick="toggleContent('${id}')">
                        <div class="key-name">
                            ${item.key} 
                            <span class="badge badge-info">点击展开</span>
                        </div>
                        <div id="${id}" class="content">
                            <pre>${JSON.stringify(JSON.parse(item.value), null, 2)}</pre>
                        </div>
                    </div>
                `;
            });
            document.getElementById('detailsList').innerHTML = html || '<p>没有数据</p>';
        }

        function checkIssues(stats, keyDetails) {
            const issues = [];

            if (stats.workoutSessions === 0) {
                issues.push({
                    type: 'warning',
                    message: '⚠️ 没有找到训练记录 (workout-sessions)',
                    solution: '可能的原因：1) 数据还未同步到localStorage 2) 使用了不同的存储键名 3) 数据在其他域名下'
                });
            }

            if (stats.weeklyReports === 0) {
                issues.push({
                    type: 'info',
                    message: 'ℹ️ 没有找到周报 (weekly-reports)',
                    solution: '这是正常的，周报会在每周结束时自动生成'
                });
            }

            if (!stats.hasProfile) {
                issues.push({
                    type: 'warning',
                    message: '⚠️ 没有找到用户资料 (user-profile)',
                    solution: '请先在设置中配置用户资料（体重、体脂率等）'
                });
            }

            // 检查是否有无效的JSON
            const invalidKeys = keyDetails.filter(k => k.type === 'invalid-json');
            if (invalidKeys.length > 0) {
                issues.push({
                    type: 'error',
                    message: `❌ 发现 ${invalidKeys.length} 个无效的JSON数据`,
                    solution: `键名: ${invalidKeys.map(k => k.key).join(', ')}`
                });
            }

            // 显示问题
            if (issues.length > 0) {
                let html = '<h2>⚠️ 发现的问题</h2>';
                issues.forEach(issue => {
                    const alertClass = issue.type === 'error' ? 'alert-error' : issue.type === 'warning' ? 'alert-warning' : 'alert-info';
                    html += `
                        <div class="alert ${alertClass}">
                            <strong>${issue.message}</strong>
                            <p style="margin-top: 5px; font-size: 14px;">${issue.solution}</p>
                        </div>
                    `;
                });
                const issuesSection = document.createElement('div');
                issuesSection.className = 'section';
                issuesSection.innerHTML = html;
                document.getElementById('summary').after(issuesSection);
            }
        }

        function toggleContent(id) {
            const element = document.getElementById(id);
            element.classList.toggle('show');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function exportData() {
            const data = {};
            Object.keys(localStorage).forEach(key => {
                try {
                    data[key] = JSON.parse(localStorage.getItem(key));
                } catch (e) {
                    data[key] = localStorage.getItem(key);
                }
            });

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `zenfit-data-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);

            alert('✅ 数据已导出！');
        }

        function clearAll() {
            if (confirm('⚠️ 确定要清空所有数据吗？此操作不可恢复！')) {
                if (confirm('⚠️⚠️ 再次确认：这将删除所有训练记录、周报和设置！')) {
                    localStorage.clear();
                    alert('✅ 所有数据已清空');
                    runDiagnostic();
                }
            }
        }

        // 页面加载时自动运行诊断
        runDiagnostic();
    </script>
</body>

</html>
