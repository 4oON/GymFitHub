<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI推荐系统调试工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }

        .section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        .button:hover {
            background: #059669;
        }

        .output {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .error {
            color: #ef4444;
        }

        .success {
            color: #10b981;
        }

        .warning {
            color: #f59e0b;
        }
    </style>
</head>

<body>
    <h1>🤖 AI推荐系统调试工具</h1>
    <p>这个工具用于调试AI推荐系统，检查历史数据查询和推荐生成是否正常工作。</p>

    <div class="section">
        <h2>📊 localStorage数据检查</h2>
        <button class="button" onclick="checkLocalStorage()">检查localStorage数据</button>
        <div id="localStorage-output" class="output"></div>
    </div>

    <div class="section">
        <h2>🔍 历史数据查询测试</h2>
        <button class="button" onclick="testHistoricalDataQuery()">测试历史数据查询</button>
        <div id="history-output" class="output"></div>
    </div>

    <div class="section">
        <h2>🎯 AI推荐生成测试</h2>
        <button class="button" onclick="testAIRecommendations()">测试AI推荐生成</button>
        <div id="ai-output" class="output"></div>
    </div>

    <div class="section">
        <h2>🧪 模拟数据生成</h2>
        <button class="button" onclick="generateMockData()">生成模拟训练数据</button>
        <div id="mock-output" class="output"></div>
    </div>

    <script>
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            element.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            element.scrollTop = element.scrollHeight;
        }

        function checkLocalStorage() {
            const output = document.getElementById('localStorage-output');
            output.innerHTML = '';

            log('localStorage-output', '🔍 检查localStorage中的训练数据...', 'info');

            // 检查zenfit_history
            const history = localStorage.getItem('zenfit_history');
            if (history) {
                try {
                    const parsed = JSON.parse(history);
                    log('localStorage-output', `✅ zenfit_history: 找到 ${parsed.length} 条训练记录`, 'success');

                    if (parsed.length > 0) {
                        const latest = parsed[0];
                        log('localStorage-output', `📅 最新训练: ${new Date(latest.date).toLocaleString()}`, 'info');
                        log('localStorage-output', `🏋️ 动作数量: ${latest.exercises?.length || 0}`, 'info');

                        // 显示一些动作示例
                        if (latest.exercises && latest.exercises.length > 0) {
                            latest.exercises.slice(0, 3).forEach((ex, i) => {
                                const completedSets = ex.sets?.filter(s => s.completed) || [];
                                log('localStorage-output', `  ${i + 1}. ${ex.exerciseName}: ${completedSets.length} 组完成`, 'info');
                                if (completedSets.length > 0) {
                                    const lastSet = completedSets[completedSets.length - 1];
                                    log('localStorage-output', `     最后一组: ${lastSet.weight}kg × ${lastSet.reps}次`, 'info');
                                }
                            });
                        }
                    }
                } catch (e) {
                    log('localStorage-output', `❌ zenfit_history 解析失败: ${e.message}`, 'error');
                }
            } else {
                log('localStorage-output', '⚠️ 未找到 zenfit_history 数据', 'warning');
            }

            // 检查其他相关数据
            const profile = localStorage.getItem('zenfit_user_profile');
            if (profile) {
                try {
                    const parsed = JSON.parse(profile);
                    log('localStorage-output', `👤 用户资料: 体重 ${parsed.weight}kg`, 'success');
                } catch (e) {
                    log('localStorage-output', `❌ 用户资料解析失败: ${e.message}`, 'error');
                }
            }
        }

        function testHistoricalDataQuery() {
            const output = document.getElementById('history-output');
            output.innerHTML = '';

            log('history-output', '🔍 测试历史数据查询服务...', 'info');

            // 模拟HistoricalDataQueryService的功能
            try {
                const historyJson = localStorage.getItem('zenfit_history');
                if (!historyJson) {
                    log('history-output', '❌ 没有找到训练历史数据', 'error');
                    return;
                }

                const sessions = JSON.parse(historyJson);
                log('history-output', `📊 加载了 ${sessions.length} 个训练记录`, 'success');

                // 统计动作
                const exerciseStats = new Map();
                sessions.forEach(session => {
                    if (session.exercises) {
                        session.exercises.forEach(exercise => {
                            const name = exercise.exerciseName;
                            if (!exerciseStats.has(name)) {
                                exerciseStats.set(name, {
                                    count: 0,
                                    weights: [],
                                    lastPerformed: 0
                                });
                            }

                            const stats = exerciseStats.get(name);
                            stats.count++;
                            stats.lastPerformed = Math.max(stats.lastPerformed, session.date);

                            if (exercise.sets) {
                                exercise.sets.forEach(set => {
                                    if (set.completed && set.weight > 0) {
                                        stats.weights.push(set.weight);
                                    }
                                });
                            }
                        });
                    }
                });

                log('history-output', `🎯 找到 ${exerciseStats.size} 种不同的动作`, 'success');

                // 显示前5个最常练的动作
                const sortedExercises = Array.from(exerciseStats.entries())
                    .sort((a, b) => b[1].count - a[1].count)
                    .slice(0, 5);

                log('history-output', '🏆 最常练的动作:', 'info');
                sortedExercises.forEach(([name, stats]) => {
                    const maxWeight = stats.weights.length > 0 ? Math.max(...stats.weights) : 0;
                    const avgWeight = stats.weights.length > 0 ?
                        Math.round(stats.weights.reduce((sum, w) => sum + w, 0) / stats.weights.length) : 0;
                    const daysSince = Math.round((Date.now() - stats.lastPerformed) / (24 * 60 * 60 * 1000));

                    log('history-output', `  ${name}: 训练${stats.count}次, 最大${maxWeight}kg, 平均${avgWeight}kg, ${daysSince}天前`, 'info');
                });

            } catch (error) {
                log('history-output', `❌ 历史数据查询失败: ${error.message}`, 'error');
            }
        }

        function testAIRecommendations() {
            const output = document.getElementById('ai-output');
            output.innerHTML = '';

            log('ai-output', '🤖 测试AI推荐生成...', 'info');

            try {
                // 检查是否有历史数据
                const historyJson = localStorage.getItem('zenfit_history');
                if (!historyJson) {
                    log('ai-output', '❌ 没有训练历史，无法生成基于历史的推荐', 'error');
                    log('ai-output', '💡 建议先生成一些模拟数据', 'warning');
                    return;
                }

                const sessions = JSON.parse(historyJson);
                log('ai-output', `📊 基于 ${sessions.length} 个训练记录生成推荐`, 'info');

                // 模拟推荐逻辑
                const exerciseFrequency = new Map();
                const recentWeights = new Map();

                sessions.forEach(session => {
                    if (session.exercises) {
                        session.exercises.forEach(exercise => {
                            const name = exercise.exerciseName;
                            exerciseFrequency.set(name, (exerciseFrequency.get(name) || 0) + 1);

                            if (exercise.sets) {
                                const completedSets = exercise.sets.filter(s => s.completed && s.weight > 0);
                                if (completedSets.length > 0) {
                                    const lastWeight = completedSets[completedSets.length - 1].weight;
                                    recentWeights.set(name, lastWeight);
                                }
                            }
                        });
                    }
                });

                // 生成推荐
                const recommendations = [];
                const commonExercises = ['Barbell Deadlift', 'Barbell Squat', 'Bench Press', 'Pull-up'];

                commonExercises.forEach(exerciseName => {
                    const frequency = exerciseFrequency.get(exerciseName) || 0;
                    const lastWeight = recentWeights.get(exerciseName) || 40;

                    if (frequency > 0) {
                        // 基于历史数据的推荐
                        const recommendedWeight = Math.round(lastWeight * 1.025); // 增加2.5%
                        recommendations.push({
                            exercise: exerciseName,
                            weight: recommendedWeight,
                            sets: 3,
                            reps: '6-8',
                            reason: `基于${frequency}次训练记录，上次重量${lastWeight}kg，建议增加到${recommendedWeight}kg`,
                            confidence: 'high'
                        });
                    } else {
                        // 基于体重比例的推荐
                        const profile = JSON.parse(localStorage.getItem('zenfit_user_profile') || '{"weight": 70}');
                        const bodyWeight = profile.weight || 70;
                        const ratio = exerciseName.includes('Deadlift') ? 1.2 :
                            exerciseName.includes('Squat') ? 1.0 : 0.8;
                        const recommendedWeight = Math.round(bodyWeight * ratio);

                        recommendations.push({
                            exercise: exerciseName,
                            weight: recommendedWeight,
                            sets: 3,
                            reps: '8-10',
                            reason: `基于体重${bodyWeight}kg的${Math.round(ratio * 100)}%比例推荐`,
                            confidence: 'medium'
                        });
                    }
                });

                log('ai-output', `✅ 生成了 ${recommendations.length} 个推荐:`, 'success');
                recommendations.forEach((rec, i) => {
                    log('ai-output', `${i + 1}. ${rec.exercise}`, 'info');
                    log('ai-output', `   重量: ${rec.weight}kg, 组数: ${rec.sets}, 次数: ${rec.reps}`, 'info');
                    log('ai-output', `   理由: ${rec.reason}`, 'info');
                    log('ai-output', `   可信度: ${rec.confidence}`, 'info');
                    log('ai-output', '', 'info');
                });

            } catch (error) {
                log('ai-output', `❌ AI推荐生成失败: ${error.message}`, 'error');
            }
        }

        function generateMockData() {
            const output = document.getElementById('mock-output');
            output.innerHTML = '';

            log('mock-output', '🧪 生成模拟训练数据...', 'info');

            try {
                const mockSessions = [];
                const exercises = [
                    { name: 'Barbell Deadlift', nameZh: '杠铃硬拉', muscleGroup: 'LATS', mechanic: 'Compound' },
                    { name: 'Barbell Squat', nameZh: '杠铃深蹲', muscleGroup: 'QUADS', mechanic: 'Compound' },
                    { name: 'Bench Press', nameZh: '卧推', muscleGroup: 'CHEST', mechanic: 'Compound' },
                    { name: 'Pull-up', nameZh: '引体向上', muscleGroup: 'LATS', mechanic: 'Compound' }
                ];

                // 生成过去30天的训练记录
                for (let i = 0; i < 10; i++) {
                    const sessionDate = Date.now() - (i * 3 * 24 * 60 * 60 * 1000); // 每3天一次训练

                    const sessionExercises = exercises.slice(0, 2 + Math.floor(Math.random() * 2)).map(ex => {
                        const baseWeight = ex.name.includes('Deadlift') ? 80 + i * 2 :
                            ex.name.includes('Squat') ? 70 + i * 2 :
                                ex.name.includes('Bench') ? 60 + i * 2 : 0;

                        const sets = [];
                        for (let s = 0; s < 3; s++) {
                            sets.push({
                                id: `set-${i}-${s}`,
                                weight: baseWeight + Math.floor(Math.random() * 10),
                                reps: 6 + Math.floor(Math.random() * 4),
                                completed: true
                            });
                        }

                        return {
                            id: `ex-${i}-${ex.name}`,
                            exerciseId: ex.name.toLowerCase().replace(/\s+/g, '-'),
                            exerciseName: ex.name,
                            exerciseNameZh: ex.nameZh,
                            muscleGroup: ex.muscleGroup,
                            mechanic: ex.mechanic,
                            sets: sets,
                            createdAt: sessionDate
                        };
                    });

                    mockSessions.push({
                        id: `session-${i}`,
                        date: sessionDate,
                        createdAt: sessionDate,
                        exercises: sessionExercises,
                        durationMinutes: 45 + Math.floor(Math.random() * 30),
                        volumeLoad: sessionExercises.reduce((total, ex) =>
                            total + ex.sets.reduce((exTotal, set) =>
                                exTotal + (set.weight * set.reps), 0), 0)
                    });
                }

                // 保存到localStorage
                localStorage.setItem('zenfit_history', JSON.stringify(mockSessions));

                log('mock-output', `✅ 成功生成 ${mockSessions.length} 个模拟训练记录`, 'success');
                log('mock-output', '📊 数据统计:', 'info');

                const totalVolume = mockSessions.reduce((sum, s) => sum + s.volumeLoad, 0);
                const avgDuration = Math.round(mockSessions.reduce((sum, s) => sum + s.durationMinutes, 0) / mockSessions.length);

                log('mock-output', `  总训练量: ${totalVolume}kg`, 'info');
                log('mock-output', `  平均时长: ${avgDuration}分钟`, 'info');
                log('mock-output', `  时间跨度: ${Math.round((mockSessions[0].date - mockSessions[mockSessions.length - 1].date) / (24 * 60 * 60 * 1000))}天`, 'info');

                log('mock-output', '💡 现在可以测试AI推荐功能了！', 'success');

            } catch (error) {
                log('mock-output', `❌ 模拟数据生成失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时自动检查数据
        window.onload = function () {
            checkLocalStorage();
        };
    </script>
</body>

</html>
