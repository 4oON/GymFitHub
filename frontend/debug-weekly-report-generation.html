<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Report Generation Debugger</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }

        h1 {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        h2 {
            color: #2196F3;
            margin-top: 30px;
        }

        .section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }

        .error {
            background: #3a1a1a;
            border-left-color: #f44336;
        }

        .warning {
            background: #3a2a1a;
            border-left-color: #ff9800;
        }

        .success {
            background: #1a3a1a;
            border-left-color: #4CAF50;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }

        button:hover {
            background: #45a049;
        }

        button.secondary {
            background: #2196F3;
        }

        button.secondary:hover {
            background: #0b7dda;
        }

        button.danger {
            background: #f44336;
        }

        button.danger:hover {
            background: #da190b;
        }

        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid #444;
        }

        .stat {
            display: inline-block;
            margin: 10px 20px 10px 0;
            padding: 10px 20px;
            background: #333;
            border-radius: 4px;
        }

        .stat-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            color: #4CAF50;
            font-size: 24px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background: #333;
            color: #4CAF50;
            font-weight: bold;
        }

        tr:hover {
            background: #333;
        }

        .week-row {
            cursor: pointer;
        }

        .week-row.has-report {
            background: #1a3a1a;
        }

        .week-row.missing-report {
            background: #3a1a1a;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.success {
            background: #4CAF50;
            color: white;
        }

        .badge.error {
            background: #f44336;
            color: white;
        }

        .log-entry {
            padding: 8px;
            margin: 4px 0;
            border-left: 3px solid #666;
            background: #222;
        }

        .log-entry.info {
            border-left-color: #2196F3;
        }

        .log-entry.success {
            border-left-color: #4CAF50;
        }

        .log-entry.error {
            border-left-color: #f44336;
        }

        .log-entry.warning {
            border-left-color: #ff9800;
        }
    </style>
</head>

<body>
    <h1>🔍 Weekly Report Generation Debugger</h1>

    <div class="section">
        <h2>📊 Current Status</h2>
        <div class="stat">
            <div class="stat-label">Total Workouts</div>
            <div class="stat-value" id="totalWorkouts">-</div>
        </div>
        <div class="stat">
            <div class="stat-label">Weeks with Workouts</div>
            <div class="stat-value" id="weeksWithWorkouts">-</div>
        </div>
        <div class="stat">
            <div class="stat-label">Existing Reports</div>
            <div class="stat-value" id="existingReports">-</div>
        </div>
        <div class="stat">
            <div class="stat-label">Missing Reports</div>
            <div class="stat-value" id="missingReports" style="color: #f44336;">-</div>
        </div>
    </div>

    <div class="section">
        <h2>🔧 Actions</h2>
        <button onclick="loadData()">🔄 Reload Data</button>
        <button class="secondary" onclick="analyzeWeeks()">🔍 Analyze Weeks</button>
        <button class="secondary" onclick="testCheckForNewWeek()">🧪 Test checkForNewWeek()</button>
        <button class="danger" onclick="generateMissingReports()">⚡ Generate Missing Reports</button>
    </div>

    <div class="section">
        <h2>📅 Week Analysis</h2>
        <div id="weekAnalysis">Click "Analyze Weeks" to see details...</div>
    </div>

    <div class="section">
        <h2>📝 Debug Log</h2>
        <div id="debugLog"></div>
    </div>

    <script>
        let workoutSessions = [];
        let weeklyReports = [];
        let debugLogs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            debugLogs.push({ timestamp, message, type });
            updateDebugLog();
        }

        function updateDebugLog() {
            const logContainer = document.getElementById('debugLog');
            logContainer.innerHTML = debugLogs.map(log =>
                `<div class="log-entry ${log.type}">
                    <strong>[${log.timestamp}]</strong> ${log.message}
                </div>`
            ).reverse().join('');
        }

        // ISO Week calculation (same as in WeeklyReportService.ts)
        function getWeekInfo(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const weekNumber = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return {
                year: d.getFullYear(),
                weekNumber: weekNumber,
                startDate: getWeekStartDate(d.getFullYear(), weekNumber),
                endDate: getWeekEndDate(d.getFullYear(), weekNumber)
            };
        }

        function getWeekStartDate(year, weekNumber) {
            const jan4 = new Date(year, 0, 4);
            const weekStart = new Date(jan4);
            weekStart.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1 + (weekNumber - 1) * 7);
            return weekStart;
        }

        function getWeekEndDate(year, weekNumber) {
            const startDate = getWeekStartDate(year, weekNumber);
            const endDate = new Date(startDate);
            endDate.setDate(startDate.getDate() + 6);
            return endDate;
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        async function loadData() {
            log('Loading data from localStorage and IndexedDB...', 'info');

            try {
                // Load workout sessions from localStorage (zenfit_history)
                const historyJson = localStorage.getItem('zenfit_history');
                if (historyJson) {
                    workoutSessions = JSON.parse(historyJson);
                    log(`✅ Loaded ${workoutSessions.length} workouts from localStorage (zenfit_history)`, 'success');
                } else {
                    workoutSessions = [];
                    log('⚠️ No workout history found in localStorage', 'warning');
                }

                // Load weekly reports from IndexedDB (ZenFitReports)
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('ZenFitReports', 1);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('reports')) {
                            const objectStore = db.createObjectStore('reports', { keyPath: 'id' });
                            objectStore.createIndex('weekNumber', 'weekNumber', { unique: false });
                            objectStore.createIndex('year', 'year', { unique: false });
                            objectStore.createIndex('createdAt', 'createdAt', { unique: false });
                            objectStore.createIndex('weekYear', ['year', 'weekNumber'], { unique: true });
                        }
                    };
                });

                weeklyReports = await new Promise((resolve, reject) => {
                    const transaction = db.transaction(['reports'], 'readonly');
                    const store = transaction.objectStore('reports');
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });

                log(`✅ Loaded ${weeklyReports.length} reports from IndexedDB (ZenFitReports)`, 'success');

                updateStats();

            } catch (error) {
                log(`❌ Error loading data: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function updateStats() {
            document.getElementById('totalWorkouts').textContent = workoutSessions.length;
            document.getElementById('existingReports').textContent = weeklyReports.length;
        }

        function analyzeWeeks() {
            log('Analyzing weeks with workouts...', 'info');

            if (workoutSessions.length === 0) {
                log('⚠️ No workout sessions found. Please check localStorage (zenfit_history)', 'warning');
                document.getElementById('weekAnalysis').innerHTML = '<p style="color: #ff9800;">No workout sessions found in localStorage.</p>';
                return;
            }

            // Group workouts by week
            const weeksMap = new Map();

            workoutSessions.forEach(session => {
                const weekInfo = getWeekInfo(new Date(session.date));
                const weekKey = `${weekInfo.year}-W${weekInfo.weekNumber}`;

                if (!weeksMap.has(weekKey)) {
                    weeksMap.set(weekKey, {
                        year: weekInfo.year,
                        weekNumber: weekInfo.weekNumber,
                        startDate: weekInfo.startDate,
                        endDate: weekInfo.endDate,
                        sessions: []
                    });
                }

                weeksMap.get(weekKey).sessions.push(session);
            });

            // Sort weeks by date
            const weeks = Array.from(weeksMap.values()).sort((a, b) => {
                if (a.year !== b.year) return a.year - b.year;
                return a.weekNumber - b.weekNumber;
            });

            document.getElementById('weeksWithWorkouts').textContent = weeks.length;

            // Check which weeks have reports
            const currentWeek = getWeekInfo(new Date());
            let missingCount = 0;

            const analysisHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Week</th>
                            <th>Date Range</th>
                            <th>Workouts</th>
                            <th>Report Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${weeks.map(week => {
                const isCurrentWeek = week.year === currentWeek.year &&
                    week.weekNumber === currentWeek.weekNumber;

                const hasReport = weeklyReports.find(r =>
                    r.year === week.year && r.weekNumber === week.weekNumber
                );

                if (!hasReport && !isCurrentWeek) {
                    missingCount++;
                }

                const rowClass = hasReport ? 'has-report' :
                    isCurrentWeek ? '' : 'missing-report';

                const status = hasReport ?
                    '<span class="badge success">✓ Has Report</span>' :
                    isCurrentWeek ?
                        '<span class="badge">Current Week</span>' :
                        '<span class="badge error">✗ Missing</span>';

                return `
                                <tr class="week-row ${rowClass}">
                                    <td><strong>Week ${week.weekNumber}, ${week.year}</strong></td>
                                    <td>${formatDate(week.startDate)} to ${formatDate(week.endDate)}</td>
                                    <td>${week.sessions.length} workouts</td>
                                    <td>${status}</td>
                                    <td>
                                        ${week.sessions.map(s =>
                    `<div style="font-size: 12px; color: #999;">
                                                ${new Date(s.date).toLocaleDateString()} - ${s.exercises?.length || 0} exercises
                                            </div>`
                ).join('')}
                                    </td>
                                </tr>
                            `;
            }).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('weekAnalysis').innerHTML = analysisHTML;
            document.getElementById('missingReports').textContent = missingCount;

            log(`✅ Analysis complete: ${weeks.length} weeks with workouts, ${missingCount} missing reports`,
                missingCount > 0 ? 'warning' : 'success');
        }

        async function testCheckForNewWeek() {
            log('Testing checkForNewWeek() logic...', 'info');

            if (workoutSessions.length === 0) {
                log('⚠️ No workout sessions found', 'warning');
                return;
            }

            // Simulate the checkForNewWeek function
            const currentWeek = getWeekInfo(new Date());
            log(`Current week: Week ${currentWeek.weekNumber}, ${currentWeek.year}`, 'info');

            // Find all weeks with workouts
            const weeksWithWorkouts = new Map();

            workoutSessions.forEach(session => {
                const sessionWeek = getWeekInfo(new Date(session.date));
                const weekKey = `${sessionWeek.year}-W${sessionWeek.weekNumber}`;

                if (!weeksWithWorkouts.has(weekKey)) {
                    weeksWithWorkouts.set(weekKey, {
                        year: sessionWeek.year,
                        weekNumber: sessionWeek.weekNumber,
                        sessions: []
                    });
                }

                weeksWithWorkouts.get(weekKey).sessions.push(session);
            });

            log(`Found ${weeksWithWorkouts.size} weeks with workouts`, 'info');

            // Find missing weeks
            const missingWeeks = [];

            for (const [weekKey, weekData] of weeksWithWorkouts) {
                // Skip current week
                if (weekData.year === currentWeek.year && weekData.weekNumber === currentWeek.weekNumber) {
                    log(`⏭️ Skipping current week: ${weekKey}`, 'info');
                    continue;
                }

                const existingReport = weeklyReports.find(
                    r => r.year === weekData.year && r.weekNumber === weekData.weekNumber
                );

                if (!existingReport) {
                    missingWeeks.push({
                        year: weekData.year,
                        weekNumber: weekData.weekNumber,
                        sessionCount: weekData.sessions.length
                    });
                    log(`❌ Missing report for Week ${weekData.weekNumber}, ${weekData.year} (${weekData.sessions.length} workouts)`, 'error');
                } else {
                    log(`✅ Report exists for Week ${weekData.weekNumber}, ${weekData.year}`, 'success');
                }
            }

            // Sort by time
            missingWeeks.sort((a, b) => {
                if (a.year !== b.year) return a.year - b.year;
                return a.weekNumber - b.weekNumber;
            });

            if (missingWeeks.length > 0) {
                const firstMissing = missingWeeks[0];
                log(`🎯 checkForNewWeek() should return: Week ${firstMissing.weekNumber}, ${firstMissing.year}`, 'warning');
                log(`📋 Total missing weeks: ${missingWeeks.length}`, 'warning');
            } else {
                log(`✅ No missing reports found!`, 'success');
            }
        }

        async function generateMissingReports() {
            log('Starting to generate missing reports...', 'info');

            if (workoutSessions.length === 0) {
                log('⚠️ No workout sessions found', 'warning');
                return;
            }

            const currentWeek = getWeekInfo(new Date());

            // Find all weeks with workouts
            const weeksWithWorkouts = new Map();

            workoutSessions.forEach(session => {
                const sessionWeek = getWeekInfo(new Date(session.date));
                const weekKey = `${sessionWeek.year}-W${sessionWeek.weekNumber}`;

                if (!weeksWithWorkouts.has(weekKey)) {
                    weeksWithWorkouts.set(weekKey, {
                        year: sessionWeek.year,
                        weekNumber: sessionWeek.weekNumber,
                        startDate: getWeekStartDate(sessionWeek.year, sessionWeek.weekNumber),
                        endDate: getWeekEndDate(sessionWeek.year, sessionWeek.weekNumber),
                        sessions: []
                    });
                }

                weeksWithWorkouts.get(weekKey).sessions.push(session);
            });

            // Find missing weeks
            const missingWeeks = [];

            for (const [weekKey, weekData] of weeksWithWorkouts) {
                // Skip current week
                if (weekData.year === currentWeek.year && weekData.weekNumber === currentWeek.weekNumber) {
                    continue;
                }

                const existingReport = weeklyReports.find(
                    r => r.year === weekData.year && r.weekNumber === weekData.weekNumber
                );

                if (!existingReport) {
                    missingWeeks.push(weekData);
                }
            }

            // Sort by time
            missingWeeks.sort((a, b) => {
                if (a.year !== b.year) return a.year - b.year;
                return a.weekNumber - b.weekNumber;
            });

            if (missingWeeks.length === 0) {
                log('✅ No missing reports to generate!', 'success');
                return;
            }

            log(`Found ${missingWeeks.length} missing reports. Generating...`, 'warning');

            // Generate reports
            for (const week of missingWeeks) {
                try {
                    log(`Generating report for Week ${week.weekNumber}, ${week.year}...`, 'info');

                    // Calculate report data
                    const report = await generateReportData(week);

                    // Save to IndexedDB
                    await saveReport(report);

                    log(`✅ Generated report for Week ${week.weekNumber}, ${week.year}`, 'success');

                } catch (error) {
                    log(`❌ Error generating report for Week ${week.weekNumber}, ${week.year}: ${error.message}`, 'error');
                }
            }

            log('🎉 Report generation complete! Reloading data...', 'success');
            await loadData();
            analyzeWeeks();
        }

        async function generateReportData(week) {
            // Calculate muscle group distribution
            const muscleGroupData = {};
            let totalVolume = 0;
            let totalSets = 0;
            let totalReps = 0;
            let totalDuration = 0;

            week.sessions.forEach(session => {
                totalDuration += session.durationMinutes || 0;

                session.exercises?.forEach(exercise => {
                    const muscleGroup = exercise.muscleGroup || 'Other';

                    if (!muscleGroupData[muscleGroup]) {
                        muscleGroupData[muscleGroup] = {
                            volume: 0,
                            sets: 0,
                            reps: 0,
                            exercises: new Set()
                        };
                    }

                    exercise.sets?.forEach(set => {
                        if (set.completed) {
                            const weight = set.weight || 0;
                            const reps = set.reps || 0;
                            const volume = weight * reps;

                            muscleGroupData[muscleGroup].volume += volume;
                            muscleGroupData[muscleGroup].sets += 1;
                            muscleGroupData[muscleGroup].reps += reps;
                            muscleGroupData[muscleGroup].exercises.add(exercise.exerciseName);

                            totalVolume += volume;
                            totalSets += 1;
                            totalReps += reps;
                        }
                    });
                });
            });

            // Convert to array format - 确保percentage是数字类型，不是字符串
            const muscleGroups = Object.entries(muscleGroupData).map(([name, data]) => ({
                muscle: name,
                totalWeight: data.volume,
                percentage: totalVolume > 0 ? (data.volume / totalVolume * 100) : 0, // 数字类型，不是字符串
                sets: data.sets,
                exercises: Array.from(data.exercises)
            }));

            // 按totalWeight降序排序
            muscleGroups.sort((a, b) => b.totalWeight - a.totalWeight);

            // Generate unique ID
            const id = `report-${week.year}-W${week.weekNumber}-${Date.now()}`;

            return {
                id,
                year: week.year,
                weekNumber: week.weekNumber,
                dateRange: {
                    start: formatDate(week.startDate),
                    end: formatDate(week.endDate)
                },
                stats: {
                    totalVolume,
                    totalSets,
                    totalReps,
                    totalDuration,
                    totalCalories: 0, // Will be calculated by the service
                    totalExercises: week.sessions.reduce((sum, s) => sum + (s.exercises?.length || 0), 0),
                    workoutDays: week.sessions.length
                },
                muscleDistribution: muscleGroups,
                sessions: week.sessions,
                createdAt: new Date().toISOString(),
                syncStatus: 'pending',
                weeklyProgress: undefined // 第一次生成时没有进度对比
            };
        }

        async function saveReport(report) {
            const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open('ZenFitReports', 1);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });

            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['reports'], 'readwrite');
                const store = transaction.objectStore('reports');
                const request = store.add(report);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // Auto-load on page load
        window.addEventListener('load', () => {
            log('🚀 Weekly Report Debugger initialized', 'success');
            loadData();
        });
    </script>
</body>

</html>
