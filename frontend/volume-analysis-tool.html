<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练Volume分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #60a5fa;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .section {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #60a5fa;
        }

        .workout-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .workout-header {
            display: flex;
            justify-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .workout-date {
            font-weight: 600;
            font-size: 20px;
            color: #60a5fa;
        }

        .workout-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-item {
            background: rgba(30, 41, 59, 0.6);
            padding: 12px;
            border-radius: 8px;
        }

        .summary-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
            color: #e2e8f0;
        }

        .exercise-list {
            margin-top: 20px;
        }

        .exercise-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exercise-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 16px;
        }

        .exercise-volume {
            font-size: 18px;
            font-weight: 700;
            color: #34d399;
        }

        .sets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .set-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .set-label {
            color: #94a3b8;
            font-size: 11px;
        }

        .set-value {
            color: #e2e8f0;
            font-weight: 600;
        }

        .analysis {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .analysis-title {
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .analysis-text {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .warning {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 训练Volume科学性分析</h1>
        <p class="subtitle">分析1月6号训练的16,244kg volume是否合理</p>

        <div id="status"></div>
        <div id="analysis"></div>
    </div>

    <script>
        // 加载和分析数据
        async function analyzeVolume() {
            const statusDiv = document.getElementById('status');
            const analysisDiv = document.getElementById('analysis');

            try {
                // 加载训练记录
                const possibleKeys = ['zenfit_history', 'workout-sessions', 'workouts'];
                let sessions = null;
                let usedKey = null;

                for (const key of possibleKeys) {
                    const data = localStorage.getItem(key);
                    if (data) {
                        try {
                            sessions = JSON.parse(data);
                            if (Array.isArray(sessions) && sessions.length > 0) {
                                usedKey = key;
                                break;
                            }
                        } catch (e) {}
                    }
                }

                if (!sessions || sessions.length === 0) {
                    statusDiv.innerHTML = '<div class="error">❌ 未找到训练记录</div>';
                    return;
                }

                // 找到1月6号的训练
                const jan6Session = sessions.find(s => {
                    const date = new Date(s.date);
                    return date.getMonth() === 0 && date.getDate() === 6 && date.getFullYear() === 2026;
                });

                if (!jan6Session) {
                    statusDiv.innerHTML = '<div class="error">❌ 未找到1月6号的训练记录</div>';
                    return;
                }

                // 分析训练数据
                const exercises = jan6Session.exercises || [];
                let totalVolume = 0;
                let exerciseDetails = [];

                exercises.forEach(ex => {
                    const completedSets = ex.sets.filter(s => s.completed);
                    let exerciseVolume = 0;
                    let setDetails = [];

                    completedSets.forEach((set, idx) => {
                        const weight = set.weight || 0;
                        const reps = set.reps || 0;
                        const setVolume = weight * reps;
                        exerciseVolume += setVolume;
                        setDetails.push({
                            setNum: idx + 1,
                            weight,
                            reps,
                            volume: setVolume
                        });
                    });

                    totalVolume += exerciseVolume;
                    exerciseDetails.push({
                        name: ex.exerciseName,
                        muscleGroup: ex.muscleGroup,
                        volume: exerciseVolume,
                        sets: setDetails,
                        totalSets: completedSets.length
                    });
                });

                // 排序：按volume从大到小
                exerciseDetails.sort((a, b) => b.volume - a.volume);

                // 生成HTML
                let html = `
                    <div class="workout-card">
                        <div class="workout-header">
                            <div class="workout-date">2026年1月6日 (周二)</div>
                        </div>

                        <div class="workout-summary">
                            <div class="summary-item">
                                <div class="summary-label">总Volume</div>
                                <div class="summary-value">${totalVolume.toLocaleString()} kg</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">动作数</div>
                                <div class="summary-value">${exercises.length}</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">总组数</div>
                                <div class="summary-value">${exerciseDetails.reduce((sum, ex) => sum + ex.totalSets, 0)}</div>
                            </div>
                            <div class="summary-item">
                                <div class="summary-label">训练时长</div>
                                <div class="summary-value">${jan6Session.durationMinutes} 分钟</div>
                            </div>
                        </div>

                        <div class="analysis">
                            <div class="analysis-title">📖 Volume计算公式</div>
                            <div class="analysis-text">
                                <strong>当前计算方法：</strong><br>
                                Volume = Σ (重量 × 次数)<br><br>
                                
                                <strong>示例：</strong><br>
                                • 第1组：100kg × 10次 = 1,000kg<br>
                                • 第2组：100kg × 8次 = 800kg<br>
                                • 第3组：100kg × 6次 = 600kg<br>
                                • 该动作总Volume = 2,400kg<br><br>

                                <strong>科学依据：</strong><br>
                                这是健身界最常用的Volume计算方法，由运动科学研究广泛采用。它反映了肌肉承受的总机械张力（mechanical tension），是肌肉生长和力量增长的关键指标。
                            </div>
                        </div>

                        <div class="exercise-list">
                            <h3 style="color: #60a5fa; margin-bottom: 15px;">动作详情（按Volume排序）</h3>
                `;

                exerciseDetails.forEach((ex, idx) => {
                    html += `
                        <div class="exercise-item">
                            <div class="exercise-header">
                                <div>
                                    <div class="exercise-name">${idx + 1}. ${ex.name}</div>
                                    <div style="color: #94a3b8; font-size: 13px; margin-top: 4px;">${ex.muscleGroup} • ${ex.totalSets}组</div>
                                </div>
                                <div class="exercise-volume">${ex.volume.toLocaleString()} kg</div>
                            </div>
                            <div class="sets-grid">
                    `;

                    ex.sets.forEach(set => {
                        html += `
                            <div class="set-item">
                                <div class="set-label">第${set.setNum}组</div>
                                <div class="set-value">${set.weight}kg × ${set.reps}次 = ${set.volume}kg</div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>

                        <div class="analysis">
                            <div class="analysis-title">🔬 科学性评估</div>
                            <div class="analysis-text">
                                <strong>1. Volume是否过高？</strong><br>
                                16,244kg的volume对于106分钟的训练来说是<strong>完全合理的</strong>。<br><br>

                                <strong>2. 为什么看起来很高？</strong><br>
                                • 如果你做了深蹲、硬拉等大重量动作，volume会快速累积<br>
                                • 例如：深蹲 100kg × 10次 × 5组 = 5,000kg<br>
                                • 这是正常的，因为volume反映的是<strong>总机械负荷</strong><br><br>

                                <strong>3. 有效Volume的定义</strong><br>
                                根据运动科学研究（Mike Israetel博士的MRV理论）：<br>
                                • <strong>有效Volume</strong>是指能够刺激肌肉适应的训练量<br>
                                • 通常以<strong>每周每个肌群的组数</strong>来衡量，而不是总重量<br>
                                • 推荐范围：每周每肌群 10-20组（中级训练者）<br><br>

                                <strong>4. 正确的评估方式</strong><br>
                                不应该只看总volume（kg），而应该看：<br>
                                • ✅ 每个肌群的<strong>周训练组数</strong><br>
                                • ✅ 训练<strong>强度</strong>（接近力竭的程度）<br>
                                • ✅ <strong>恢复能力</strong>（是否能在下次训练前恢复）<br>
                                • ✅ <strong>进步速度</strong>（力量和肌肉是否持续增长）<br><br>

                                <strong>5. 建议</strong><br>
                                • 当前的volume计算方法是<strong>科学且标准的</strong><br>
                                • 16,244kg对于106分钟的训练是<strong>正常范围</strong><br>
                                • 如果你能完成这些训练并且恢复良好，说明volume是<strong>适合你的</strong><br>
                                • 不要被数字吓到，关注<strong>训练质量和恢复</strong>更重要
                            </div>
                        </div>
                    </div>
                `;

                analysisDiv.innerHTML = html;

            } catch (error) {
                console.error('分析失败:', error);
                statusDiv.innerHTML = `<div class="error">❌ 分析失败: ${error.message}</div>`;
            }
        }

        // 页面加载时执行
        window.addEventListener('DOMContentLoaded', analyzeVolume);
    </script>
</body>
</html>
