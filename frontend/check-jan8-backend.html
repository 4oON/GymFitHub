<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查后端1月8号数据</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .info-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status.ok {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .workout-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }

        .workout-date {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .workout-details {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }

        .exercise-list {
            margin-top: 10px;
            padding-left: 20px;
        }

        .exercise-item {
            font-size: 12px;
            color: #555;
            margin: 4px 0;
        }

        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.warning {
            color: #ffd93d;
        }

        .log-entry.success {
            color: #6bcf7f;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 检查后端1月8号数据</h1>
        <p class="subtitle">从后端数据库读取1月8号的训练记录</p>

        <!-- 认证信息 -->
        <div class="section">
            <h2>🔐 认证信息</h2>
            <div class="input-group">
                <label>Auth Token (从 localStorage 自动读取)</label>
                <input type="text" id="authToken" readonly placeholder="将自动从 localStorage 读取">
            </div>
            <button onclick="loadAuthToken()">🔄 加载 Token</button>
        </div>

        <!-- 查询结果 -->
        <div class="section">
            <h2>📊 查询结果</h2>
            <div id="queryResults"></div>
            <button onclick="queryJan8Data()" id="queryBtn">🔍 查询1月8号数据</button>
            <button onclick="queryAllWorkouts()">📋 查询所有训练记录</button>
        </div>

        <!-- 1月8号记录 -->
        <div class="section" id="jan8Section" style="display: none;">
            <h2>📅 1月8号训练记录</h2>
            <div id="jan8Records"></div>
        </div>

        <!-- 所有记录 -->
        <div class="section" id="allSection" style="display: none;">
            <h2>📋 所有训练记录</h2>
            <div id="allRecords"></div>
        </div>

        <!-- 日志 -->
        <div class="section">
            <h2>📝 操作日志</h2>
            <div class="log" id="logOutput"></div>
        </div>
    </div>

    <script>
        // API 配置
        const API_BASE_URL = 'https://kilo-zenfit-production.up.railway.app';

        // 日志函数
        function log(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logOutput.appendChild(entry);
            logOutput.scrollTop = logOutput.scrollHeight;
            console.log(message);
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return '无效日期';
            }
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // 检查日期是否为1月8号
        function isJan8(dateString) {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return false;
            // 2026年1月8号
            return date.getFullYear() === 2026 && date.getMonth() === 0 && date.getDate() === 8;
        }

        // 加载认证 Token
        function loadAuthToken() {
            const token = localStorage.getItem('zenfit_auth_token');
            const tokenInput = document.getElementById('authToken');

            if (token) {
                tokenInput.value = token;
                log('✅ 成功加载 Auth Token', 'success');
            } else {
                tokenInput.value = '';
                log('❌ 未找到 Auth Token，请先登录', 'error');
            }
        }

        // 查询1月8号数据
        async function queryJan8Data() {
            const token = document.getElementById('authToken').value;

            if (!token) {
                log('❌ 请先加载 Auth Token', 'error');
                alert('请先点击"加载 Token"按钮');
                return;
            }

            const queryBtn = document.getElementById('queryBtn');
            queryBtn.disabled = true;
            queryBtn.textContent = '🔄 查询中...';

            log('🔍 开始查询1月8号数据...', 'info');

            try {
                // 调用后端 API
                const response = await fetch(`${API_BASE_URL}/api/workouts?status=completed`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                log(`✅ 成功获取 ${data.workouts?.length || 0} 条训练记录`, 'success');

                // 过滤1月8号的记录
                const jan8Records = (data.workouts || []).filter(workout => isJan8(workout.date));

                const resultsDiv = document.getElementById('queryResults');
                const jan8Section = document.getElementById('jan8Section');
                const jan8RecordsDiv = document.getElementById('jan8Records');

                if (jan8Records.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="info-box">
                            <p style="color: #dc3545; font-weight: 600;">❌ 后端数据库中未找到1月8号的训练记录</p>
                            <p style="font-size: 12px; color: #666; margin-top: 10px;">
                                总记录数: ${data.workouts?.length || 0}<br>
                                可能原因：记录未同步到后端或已被删除
                            </p>
                        </div>
                    `;
                    log('❌ 后端数据库中未找到1月8号的记录', 'error');
                } else {
                    resultsDiv.innerHTML = `
                        <div class="info-box">
                            <p style="color: #28a745; font-weight: 600;">✅ 找到 ${jan8Records.length} 条1月8号的训练记录</p>
                        </div>
                    `;
                    log(`✅ 找到 ${jan8Records.length} 条1月8号的记录`, 'success');

                    // 显示详细记录
                    jan8RecordsDiv.innerHTML = '';
                    jan8Records.forEach((workout, index) => {
                        const exercises = workout.exercises || [];
                        const exerciseList = exercises.map(ex =>
                            `<div class="exercise-item">• ${ex.notes || 'Unknown'}: ${ex.sets} 组 × ${ex.reps} 次 @ ${ex.weight}kg</div>`
                        ).join('');

                        jan8RecordsDiv.innerHTML += `
                            <div class="workout-item">
                                <div class="workout-date">记录 #${index + 1}: ${formatDate(workout.date)}</div>
                                <div class="workout-details">
                                    <strong>ID:</strong> ${workout.id}<br>
                                    <strong>状态:</strong> ${workout.status}<br>
                                    <strong>时长:</strong> ${workout.durationMin || 0} 分钟<br>
                                    <strong>动作数:</strong> ${exercises.length}<br>
                                    <strong>创建时间:</strong> ${formatDate(workout.createdAt)}
                                </div>
                                ${exercises.length > 0 ? `
                                    <div class="exercise-list">
                                        <strong>动作列表:</strong>
                                        ${exerciseList}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });

                    jan8Section.style.display = 'block';
                }

            } catch (error) {
                log(`❌ 查询失败: ${error.message}`, 'error');
                const resultsDiv = document.getElementById('queryResults');
                resultsDiv.innerHTML = `
                    <div class="info-box">
                        <p style="color: #dc3545; font-weight: 600;">❌ 查询失败</p>
                        <p style="font-size: 12px; color: #666; margin-top: 10px;">
                            错误信息: ${error.message}<br>
                            请检查网络连接和认证状态
                        </p>
                    </div>
                `;
            } finally {
                queryBtn.disabled = false;
                queryBtn.textContent = '🔍 查询1月8号数据';
            }
        }

        // 查询所有训练记录
        async function queryAllWorkouts() {
            const token = document.getElementById('authToken').value;

            if (!token) {
                log('❌ 请先加载 Auth Token', 'error');
                alert('请先点击"加载 Token"按钮');
                return;
            }

            log('🔍 开始查询所有训练记录...', 'info');

            try {
                const response = await fetch(`${API_BASE_URL}/api/workouts?status=completed`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const workouts = data.workouts || [];
                log(`✅ 成功获取 ${workouts.length} 条训练记录`, 'success');

                const allSection = document.getElementById('allSection');
                const allRecordsDiv = document.getElementById('allRecords');

                if (workouts.length === 0) {
                    allRecordsDiv.innerHTML = `
                        <div class="info-box">
                            <p style="color: #666;">暂无训练记录</p>
                        </div>
                    `;
                } else {
                    // 按日期排序（最新的在前）
                    workouts.sort((a, b) => new Date(b.date) - new Date(a.date));

                    allRecordsDiv.innerHTML = '';
                    workouts.forEach((workout, index) => {
                        const date = new Date(workout.date);
                        const isJan8Record = isJan8(workout.date);
                        const highlightClass = isJan8Record ? 'style="background: #fff3cd; border-color: #ffc107;"' : '';

                        allRecordsDiv.innerHTML += `
                            <div class="workout-item" ${highlightClass}>
                                <div class="workout-date">
                                    ${formatDate(workout.date)}
                                    ${isJan8Record ? '<span class="status ok">1月8号</span>' : ''}
                                </div>
                                <div class="workout-details">
                                    <strong>ID:</strong> ${workout.id}<br>
                                    <strong>动作数:</strong> ${workout.exercises?.length || 0}<br>
                                    <strong>时长:</strong> ${workout.durationMin || 0} 分钟
                                </div>
                            </div>
                        `;
                    });

                    // 统计1月8号记录
                    const jan8Count = workouts.filter(w => isJan8(w.date)).length;
                    if (jan8Count > 0) {
                        log(`✅ 在所有记录中找到 ${jan8Count} 条1月8号的记录`, 'success');
                    }
                }

                allSection.style.display = 'block';

            } catch (error) {
                log(`❌ 查询失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时自动加载 Token
        window.addEventListener('load', () => {
            log('🚀 后端数据查询工具已启动', 'success');
            loadAuthToken();
        });
    </script>
</body>

</html>
