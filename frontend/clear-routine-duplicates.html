<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除Routine重复数据</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #10b981;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #10b981, #14b8a6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        button.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        button.danger:hover {
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .info-box {
            background: #334155;
            border-left: 4px solid #10b981;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .warning-box {
            background: #451a03;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }

        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            color: #10b981;
            font-size: 14px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #334155;
        }

        .success {
            border-left: 4px solid #10b981;
        }

        .error {
            border-left: 4px solid #ef4444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧹 清除Routine重复数据</h1>
        <p class="subtitle">清理localStorage中的重复routine记录</p>

        <div class="info-box">
            <strong>📊 当前状态：</strong>
            <div id="currentStatus">正在检查...</div>
        </div>

        <div class="warning-box">
            <strong>⚠️ 注意：</strong>
            <ul>
                <li>此操作会清除localStorage中的重复routine</li>
                <li>保留后端UUID版本和最新的记录</li>
                <li>建议先查看当前数据再执行清理</li>
            </ul>
        </div>

        <div style="margin: 20px 0;">
            <button onclick="checkRoutines()">🔍 查看当前Routines</button>
            <button onclick="cleanDuplicates()">🧹 清除重复数据</button>
            <button onclick="clearAllRoutines()" class="danger">🗑️ 清空所有Routines</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function checkRoutines() {
            const routinesStr = localStorage.getItem('zenfit_routines');
            const result = document.getElementById('result');

            if (!routinesStr) {
                result.innerHTML = '<div class="result error">❌ 未找到routine数据</div>';
                return;
            }

            try {
                const routines = JSON.parse(routinesStr);
                const nameCount = {};

                routines.forEach(r => {
                    const name = r.name.toLowerCase().trim();
                    nameCount[name] = (nameCount[name] || 0) + 1;
                });

                const duplicates = Object.entries(nameCount).filter(([_, count]) => count > 1);

                let html = `<div class="result success">
                    <strong>📋 当前Routines数量：${routines.length}</strong><br><br>`;

                if (duplicates.length > 0) {
                    html += `<strong style="color: #f59e0b;">⚠️ 发现重复：</strong><br>`;
                    duplicates.forEach(([name, count]) => {
                        html += `- "${name}": ${count}个重复<br>`;
                    });
                } else {
                    html += `<strong style="color: #10b981;">✅ 没有发现重复</strong>`;
                }

                html += `<br><br><strong>详细数据：</strong><pre>${JSON.stringify(routines, null, 2)}</pre></div>`;
                result.innerHTML = html;

                // 更新状态
                updateStatus(routines.length, duplicates.length);
            } catch (e) {
                result.innerHTML = `<div class="result error">❌ 解析数据失败：${e.message}</div>`;
            }
        }

        function cleanDuplicates() {
            const routinesStr = localStorage.getItem('zenfit_routines');
            const result = document.getElementById('result');

            if (!routinesStr) {
                result.innerHTML = '<div class="result error">❌ 未找到routine数据</div>';
                return;
            }

            try {
                const routines = JSON.parse(routinesStr);
                const routineMap = new Map();
                const nameMap = new Map();

                // 使用与RoutineSyncService相同的去重逻辑
                routines.forEach(routine => {
                    const normalizedName = routine.name.toLowerCase().trim();
                    const isBackendId = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(routine.id);

                    if (routineMap.has(routine.id)) {
                        // ID相同，保留最新的
                        const existing = routineMap.get(routine.id);
                        if (routine.createdAt > existing.createdAt) {
                            routineMap.set(routine.id, routine);
                        }
                    } else if (nameMap.has(normalizedName)) {
                        // 名称相同但ID不同
                        const existingId = nameMap.get(normalizedName);
                        const existing = routineMap.get(existingId);
                        const existingIsBackendId = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(existingId);

                        // 优先保留后端ID版本
                        if (isBackendId && !existingIsBackendId) {
                            routineMap.delete(existingId);
                            routineMap.set(routine.id, routine);
                            nameMap.set(normalizedName, routine.id);
                        } else if (!isBackendId && existingIsBackendId) {
                            // 跳过，保留现有的后端版本
                        } else {
                            // 都是后端ID或都是本地ID，保留最新的
                            if (routine.createdAt > existing.createdAt) {
                                routineMap.delete(existingId);
                                routineMap.set(routine.id, routine);
                                nameMap.set(normalizedName, routine.id);
                            }
                        }
                    } else {
                        // 新的routine
                        routineMap.set(routine.id, routine);
                        nameMap.set(normalizedName, routine.id);
                    }
                });

                const cleanedRoutines = Array.from(routineMap.values())
                    .sort((a, b) => b.createdAt - a.createdAt);

                const removedCount = routines.length - cleanedRoutines.length;

                // 保存清理后的数据
                localStorage.setItem('zenfit_routines', JSON.stringify(cleanedRoutines));

                result.innerHTML = `<div class="result success">
                    <strong>✅ 清理完成！</strong><br><br>
                    原始数量：${routines.length}<br>
                    清理后数量：${cleanedRoutines.length}<br>
                    删除重复：${removedCount}个<br><br>
                    <strong>请刷新页面查看效果</strong>
                </div>`;

                updateStatus(cleanedRoutines.length, 0);
            } catch (e) {
                result.innerHTML = `<div class="result error">❌ 清理失败：${e.message}</div>`;
            }
        }

        function clearAllRoutines() {
            if (!confirm('⚠️ 确定要清空所有Routines吗？此操作不可恢复！')) {
                return;
            }

            localStorage.removeItem('zenfit_routines');
            document.getElementById('result').innerHTML = `<div class="result success">
                <strong>✅ 已清空所有Routines</strong><br><br>
                <strong>请刷新页面查看效果</strong>
            </div>`;
            updateStatus(0, 0);
        }

        function updateStatus(total, duplicates) {
            const status = document.getElementById('currentStatus');
            if (duplicates > 0) {
                status.innerHTML = `<span style="color: #f59e0b;">⚠️ ${total}个routines，发现${duplicates}组重复</span>`;
            } else if (total > 0) {
                status.innerHTML = `<span style="color: #10b981;">✅ ${total}个routines，无重复</span>`;
            } else {
                status.innerHTML = `<span style="color: #94a3b8;">📭 暂无routine数据</span>`;
            }
        }

        // 页面加载时自动检查
        window.onload = checkRoutines;
    </script>
</body>

</html>
